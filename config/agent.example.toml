# Kredensial (TICKO_LLM_API_KEY) hanya dari environment.

provider = "anthropic" # anthropic | openai
model = "claude-opus-5"
# openai: "https://api.openai.com/v1", atau endpoint lain yang kompatibel
base_url = "https://api.anthropic.com"
max_output_tokens = 1024
context_max_tokens = 8000
recent_messages = 20

# Tarif USD per sejuta token, untuk cost_estimate di agent_runs. Nilai di bawah
# adalah tarif claude-opus-5 per 2026-06; sesuaikan bila model/penyedia diganti.
input_usd_per_mtok = 5
output_usd_per_mtok = 25
