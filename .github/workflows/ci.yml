name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: ticko
          POSTGRES_PASSWORD: ticko
          POSTGRES_DB: ticko
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ticko -d ticko"
          --health-interval 2s --health-retries 15
    env:
      TICKO_DATABASE_URL: postgres://ticko:ticko@127.0.0.1:5432/ticko
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:domain-deps
      # Migrasi dari database kosong setiap PR (CONVENTIONS §4).
      - run: bun run db:migrate
      - run: bun run db:check
      - run: bun test
